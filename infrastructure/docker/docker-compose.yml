services:
  mongodb:
    image: mongo:7.0
    container_name: wa-saas-mongodb
    restart: unless-stopped
    ports:
      # Exposed locally for development convenience; do not expose in production
      - '127.0.0.1:27017:27017'
    environment:
      MONGO_INITDB_DATABASE: whatsapp_saas_dev
    volumes:
      - mongo-data:/data/db
    networks:
      - wa-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: wa-saas-redis
    restart: unless-stopped
    ports:
      # Exposed locally for development convenience; do not expose in production
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - wa-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo-data:
    name: wa-saas-mongo-data
  redis-data:
    name: wa-saas-redis-data

networks:
  wa-network:
    name: wa-saas-network
    driver: bridge
